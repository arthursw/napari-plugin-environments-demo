[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-isolation-demo"
version = "0.2.0"
description = "Minimal managed plugin environment demonstration"
requires-python = ">=3.11"
dependencies = ["napari", "numpy", "qtpy"]

[project.optional-dependencies]
testing = ["build", "pyqt6", "pytest", "pytest-qt"]

[project.entry-points."napari.manifest"]
napari-isolation-demo = "napari_isolation_demo:napari.yaml"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_isolation_demo = ["napari.yaml", "worker/pyproject.toml", "worker/*.py"]
